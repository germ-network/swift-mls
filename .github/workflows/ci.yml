name: CI

# Pull-request-scoped only: `main` is a bare bootstrap skeleton (empty
# Package.swift, no Sources/Tests) until the phase PR stack merges, so a
# push-to-main run would have nothing to lint or test. Every phase PR runs
# this against its own populated branch, which is the gate that actually
# matters here. Re-add `push: branches: [main]` once the stack has landed
# and main carries real sources.
on:
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: swift-actions/setup-swift@v2
        with:
          swift-version: "6.1"
      # --strict: warnings fail the job too, not only errors — .swift-format
      # here matches AtprotoTypes/jxl-encoder-swift's config exactly, but
      # unlike those two repos this is actually enforced in CI, not merely
      # present. Sources/mls-interop-server/Generated is protoc output, not
      # hand-maintained — excluded the same way its Package.swift target
      # exclude keeps it out of the build's own style checks. A directory
      # list with --recursive does NOT work here: passing the Generated
      # directory's *parent* still walks back down into it. Pass an
      # explicit flat file list instead (paths, not --recursive dirs).
      - run: |
          swift format lint --configuration .swift-format --strict \
            $(find Sources Tests -name Generated -prune -o -name '*.swift' -print)

  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: swift-actions/setup-swift@v2
        with:
          swift-version: "6.1"
      - run: swift test

  linux:
    runs-on: ubuntu-latest
    container: swift:6.1
    steps:
      - uses: actions/checkout@v4
      - run: swift test

  ios-build:
    # The library must build for iOS even though CI can only exercise its
    # tests on macOS/Linux — swift test does not run on a simulator here.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      # SwiftPM auto-generates one scheme per product, plus an umbrella
      # "swift-mls-Package" once there is more than one product (a single
      # same-named "swift-mls" scheme when there is exactly one — phase-0
      # had only MLSCodec). This file serves every phase branch, so it
      # discovers schemes at run time rather than hardcoding them.
      #
      # Since phase 7 the package also has an executable product
      # (mls-interop-server, the gRPC interop harness) that cannot build
      # for iOS: grpc-swift 2 requires iOS 18, above this library's iOS 17
      # floor, and it is a server tool with no iOS reason to exist. Its
      # sources are `#if os(macOS) || os(Linux)`-gated to nothing on
      # other platforms, so building the umbrella scheme tries to link it
      # anyway and fails on a missing `_main`. Build each *library*
      # product's own scheme instead of the umbrella, skipping executables.
      - run: |
          if xcodebuild -list 2>/dev/null | grep -q swift-mls-Package; then
            libraries=$(swift package dump-package | python3 -c "
          import json, sys
          pkg = json.load(sys.stdin)
          executables = {t['name'] for t in pkg['targets'] if t['type'] == 'executable'}
          for p in pkg['products']:
              if p['name'] not in executables:
                  print(p['name'])
          ")
            for scheme in $libraries; do
              xcodebuild build -scheme "$scheme" -destination 'generic/platform=iOS'
            done
          else
            xcodebuild build -scheme swift-mls -destination 'generic/platform=iOS'
          fi
